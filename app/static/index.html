<!DOCTYPE html>
<html>
  <head>
    <title>GitHub Desktop</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      ;(function () {
        if (window.process !== undefined) {
          return
        }

        var platform = 'linux'
        var arch = 'x64'
        var text = (
          (navigator.userAgentData && navigator.userAgentData.platform) ||
          navigator.platform ||
          navigator.userAgent ||
          ''
        ).toLowerCase()

        if (text.indexOf('win') >= 0) {
          platform = 'win32'
        } else if (text.indexOf('mac') >= 0 || text.indexOf('darwin') >= 0) {
          platform = 'darwin'
        }

        if (
          navigator.userAgent.toLowerCase().indexOf('aarch64') >= 0 ||
          navigator.userAgent.toLowerCase().indexOf('arm64') >= 0
        ) {
          arch = 'arm64'
        } else if (navigator.userAgent.toLowerCase().indexOf('arm') >= 0) {
          arch = 'arm'
        }

        function normalizeSystemVersion(value) {
          if (!value) {
            return '0.0.0'
          }

          var parts = value
            .replace(/_/g, '.')
            .split('.')
            .map(function (part) {
              var match = /^\d+/.exec(part)
              return match && match[0]
            })
            .filter(Boolean)

          if (parts.length === 0) {
            return '0.0.0'
          }

          while (parts.length < 3) {
            parts.push('0')
          }

          return parts.slice(0, 3).join('.')
        }

        function detectSystemVersion() {
          var source = text + ' ' + (navigator.userAgent || '')

          if (/win/i.test(source)) {
            var windowsMatch = /Windows NT ([\d.]+)/i.exec(source)
            return normalizeSystemVersion(windowsMatch && windowsMatch[1])
          }

          if (/mac|darwin/i.test(source)) {
            var macMatch = /Mac OS X ([\d_.]+)/i.exec(source)
            return normalizeSystemVersion(macMatch && macMatch[1])
          }

          if (/android/i.test(source)) {
            var androidMatch = /Android ([\d.]+)/i.exec(source)
            return normalizeSystemVersion(androidMatch && androidMatch[1])
          }

          return '0.0.0'
        }

        function getSystemErrorName(code) {
          switch (code) {
            case -2:
              return 'ENOENT'
            case -13:
              return 'EACCES'
            case -17:
              return 'EEXIST'
            case -20:
              return 'ENOTDIR'
            case -21:
              return 'EISDIR'
            case -22:
              return 'EINVAL'
            case -24:
              return 'EMFILE'
            case -28:
              return 'ENOSPC'
            case -32:
              return 'EPIPE'
            case -98:
              return 'EADDRINUSE'
            case -111:
              return 'ECONNREFUSED'
            default:
              if (code >= 0) {
                throw new Error('err >= 0')
              }

              return 'Unknown system error ' + code
          }
        }

        function binding(name) {
          if (name === 'uv') {
            return { errname: getSystemErrorName }
          }

          if (name === 'buffer') {
            return { kStringMaxLength: Number.MAX_SAFE_INTEGER }
          }

          if (name === 'natives') {
            return {}
          }

          throw new Error(
            "process.binding('" + name + "') is not available in GitDesk WebUI"
          )
        }

        var listeners = {}
        var shim = {
          arch: arch,
          argv: [],
          binding: binding,
          browser: true,
          cwd: function () {
            return '/'
          },
          emit: function (event) {
            var args = Array.prototype.slice.call(arguments, 1)
            var eventListeners = listeners[event] || []
            eventListeners.slice().forEach(function (listener) {
              listener.apply(null, args)
            })
            return eventListeners.length > 0
          },
          env: { NODE_ENV: 'production' },
          execPath: 'GitDesk WebUI',
          getSystemVersion: detectSystemVersion,
          nextTick: function (callback) {
            Promise.resolve().then(callback)
          },
          off: function (event, listener) {
            listeners[event] = (listeners[event] || []).filter(function (x) {
              return x !== listener
            })
            return shim
          },
          on: function (event, listener) {
            listeners[event] = listeners[event] || []
            listeners[event].push(listener)
            return shim
          },
          once: function (event, listener) {
            var wrapped = function () {
              shim.off(event, wrapped)
              listener.apply(null, arguments)
            }
            return shim.on(event, wrapped)
          },
          platform: platform,
          removeListener: function (event, listener) {
            return shim.off(event, listener)
          },
          stderr: null,
          stdout: null,
          type: 'renderer',
          versions: { node: '0.0.0' },
        }

        window.process = shim
      })()
    </script>
  </head>
  <body>
    <div id="desktop-app-container"></div>
  </body>
</html>
